  </div>
</header>

<main>
  <section class="intro">
    <h1 id="headline">Ports for Nintendo Switch</h1>
    <p id="tagline"></p>
  </section>

  <section class="latest" aria-labelledby="latest-title">
    <h2 id="latest-title">Latest releases</h2>
    <div class="row-wrap">
      <button class="row-nav prev" type="button" aria-label="Scroll back" tabindex="-1">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="m15 5-7 7 7 7"/></svg>
      </button>
      <div class="row" id="row"></div>
      <button class="row-nav next" type="button" aria-label="Scroll on" tabindex="-1">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <section class="all" aria-labelledby="all-title">
    <div class="all-head">
      <h2 id="all-title">All software <span class="count" id="count"></span></h2>
      <div class="pills" id="filters" role="group" aria-label="Filter by how the port was made"></div>
      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="m16 16 4.5 4.5"/></svg>
          <span class="sr">Search ports</span>
          <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
        </label>
        <div class="pills sort" id="sorts" role="group" aria-label="Sort"></div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden></p>
  </section>
</main>

<footer class="foot">
  <p id="legal">Unofficial homebrew, not affiliated with Nintendo or any game's publisher.</p>
  <p id="updated"></p>
</footer>

<dialog class="detail" id="detail" aria-labelledby="d-title">
  <button class="icon-btn d-close" type="button" data-act="close" aria-label="Close">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="d-body">
    <img class="d-icon" id="d-icon" width="256" height="256" alt="">
    <div class="d-main">
      <p class="d-kicker" id="d-kicker"></p>
      <h2 class="d-title" id="d-title"></h2>
      <p class="d-desc" id="d-desc"></p>
      <dl class="d-meta" id="d-meta"></dl>
      <div class="d-note" id="d-note"></div>
      <div class="d-actions" id="d-actions"></div>
    </div>
  </div>
</dialog>
